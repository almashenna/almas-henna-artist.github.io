<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Almas Henna Artist Dubai - Bridal Mehndi, home service, weddings, school events, cultural programs, UAE National Day and event henna services. 25+ years experience.">
  <meta name="keywords" content="henna artist Dubai, mehndi artist Dubai, bridal mehndi Dubai, event henna Dubai, school henna Dubai, UAE National Day henna">
  <title>Almas Henna Artist | Dubai | 25+ Years Experience</title>
  <style>
    :root{--green:#183f35;--gold:#b48632;--cream:#faf7ef;--ink:#2d2924;--soft:#eee7d7}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:var(--cream);line-height:1.6}
    nav{position:sticky;top:0;z-index:20;background:rgba(250,247,239,.96);border-bottom:1px solid #e5dcc9;display:flex;justify-content:space-between;align-items:center;padding:12px 6%}
    nav img{height:58px;width:auto} nav a{color:var(--green);text-decoration:none;margin-left:24px;font-family:Arial,sans-serif;font-size:14px;font-weight:700}
    .hero{min-height:78vh;display:grid;place-items:center;text-align:center;padding:70px 6%;background:radial-gradient(circle at 50% 20%,#fffdf8 0,#faf7ef 55%,#eee7d7 100%)}
    .hero img{width:min(300px,72vw);margin-bottom:18px}.eyebrow{letter-spacing:3px;text-transform:uppercase;color:var(--gold);font:700 13px Arial,sans-serif}
    h1{font-size:clamp(42px,7vw,76px);line-height:1.05;color:var(--green);margin:8px 0 16px}
    .hero p{max-width:760px;margin:0 auto 28px;font-size:20px}.btn{display:inline-block;background:var(--green);color:white;text-decoration:none;padding:13px 24px;border-radius:30px;font:700 14px Arial,sans-serif;margin:5px}.btn.gold{background:var(--gold)}
    section{padding:72px 6%;max-width:1180px;margin:auto}.section-title{text-align:center;color:var(--green);font-size:38px;margin:0 0 10px}.section-sub{text-align:center;max-width:720px;margin:0 auto 38px;font-family:Arial,sans-serif;color:#615b51}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{background:#fffdf8;border:1px solid #e5dcc9;border-radius:18px;padding:28px;box-shadow:0 8px 25px rgba(40,30,15,.06)}
    .icon{font-size:30px;color:var(--gold)} .card h3{color:var(--green);margin:8px 0;font-size:22px}.card p{font-family:Arial,sans-serif;font-size:14px;color:#625c53}
    .band{background:var(--green);color:white;max-width:none;text-align:center}.band .section-title{color:white}.band .section-sub{color:#eee7d7}
    .about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.about-box{background:white;border-radius:22px;padding:32px;border:1px solid #e5dcc9}.about ul{font-family:Arial,sans-serif;padding-left:20px}
    .contact{display:grid;grid-template-columns:1fr 1fr;gap:25px}.contact-box{background:#fffdf8;border:1px solid #e5dcc9;border-radius:18px;padding:28px}.contact a{color:var(--green);font-weight:700;text-decoration:none}
    footer{background:#102f28;color:#eee7d7;text-align:center;padding:30px 6%;font-family:Arial,sans-serif;font-size:13px}
